# Build the Claviq Desk images and roll them out to the VPS.
#
# Triggered only by `prod` — `main` is the integration branch and is not deployed.
# Merging or fast-forwarding main into prod is what ships.
name: deploy-prod

on:
  push:
    branches: [prod]
  workflow_dispatch:

env:
  BACKEND_IMAGE: ghcr.io/achinthapallegedara/claviq-desk-backend
  WEB_IMAGE: ghcr.io/achinthapallegedara/claviq-desk-web
  APP_DIR: /opt/desk-prod

# One deploy at a time: two overlapping runs could migrate the same database concurrently.
concurrency:
  group: deploy-prod-claviq-desk
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Unit tests only: the DB integration tests skip without DATABASE_URL.
      - run: go vet ./... && go test ./...
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run lint
        working-directory: web

  build:
    needs: test
    # workflow_dispatch can be started from any branch in the UI; only prod may publish :prod.
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: web
            context: web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tagged twice: :prod is what the VPS compose file pulls; the commit SHA is an
      # immutable tag to roll back to.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/achinthapallegedara/claviq-desk-${{ matrix.name }}:prod
            ghcr.io/achinthapallegedara/claviq-desk-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open an SSH session to the VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # This repository owns the stack definition, so it ships the compose file and the
      # one-time DB bootstrap script. .env is deliberately NOT synced: it holds the
      # credentials and stays on the VPS, mode 600.
      - name: Sync the compose file
        run: |
          T="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          ssh -o BatchMode=yes "$T" "test -f $APP_DIR/.env" || {
            echo "::error::$APP_DIR/.env is missing on the VPS (see deploy/prod/.env.example)"
            exit 1
          }
          scp -o BatchMode=yes deploy/prod/docker-compose.yml "$T:$APP_DIR/docker-compose.yml"
          scp -o BatchMode=yes -r deploy/prod/initdb "$T:$APP_DIR/"
          ssh -o BatchMode=yes "$T" "cd $APP_DIR && docker compose config --quiet" || {
            echo "::error::the synced compose file is not valid against the host's .env"
            exit 1
          }

      # Pull, migrate, restart and verify in one session so the previous image ids are
      # still in scope if the new ones have to be backed out.
      #
      # Migrations are NOT rolled back: goose can't know which ones the old binary
      # tolerates, and guessing risks data. A failed deploy keeps the new schema and
      # needs a human if the old binary can't run against it.
      - name: Deploy, verify, and roll back on failure
        run: |
          set -o pipefail
          out=$(ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -euo pipefail <<'REMOTE'
            cd /opt/desk-prod

            PREV_BACKEND=$(docker inspect --format '{{.Image}}' desk-prod-backend-1 2>/dev/null || true)
            PREV_WEB=$(docker inspect --format '{{.Image}}' desk-prod-web-1 2>/dev/null || true)
            echo "currently running: backend=${PREV_BACKEND:-none} web=${PREV_WEB:-none}"

            docker compose pull backend web migrate

            # </dev/null is load-bearing: this script is fed to bash on stdin, and
            # `docker compose run` attaches stdin by default — without the redirect it
            # swallows the rest of the script and the job exits 0 having done nothing.
            docker compose up -d --wait db </dev/null
            docker compose run --rm -T migrate up </dev/null

            docker compose up -d backend web </dev/null

            # Checks web, the web->backend proxy, the backend and the database in one call.
            ready=0
            for i in $(seq 1 45); do
              if docker compose exec -T web wget -qO- http://127.0.0.1:3000/api/health 2>/dev/null </dev/null | grep -q '"ok"'; then
                ready=1; break
              fi
              sleep 2
            done

            if [ "$ready" = "1" ]; then
              echo "claviq desk is ready"
              docker image prune -f --filter "until=168h"
              echo "__DEPLOY_REACHED_END__"
              exit 0
            fi

            echo "::error::/api/health did not pass within 90s"
            docker compose logs --tail=60 backend web

            if [ -n "$PREV_BACKEND" ] && [ -n "$PREV_WEB" ]; then
              echo "rolling back to backend=$PREV_BACKEND web=$PREV_WEB"
              docker tag "$PREV_BACKEND" ghcr.io/achinthapallegedara/claviq-desk-backend:prod
              docker tag "$PREV_WEB" ghcr.io/achinthapallegedara/claviq-desk-web:prod
              docker compose up -d backend web </dev/null
              echo "rolled back — NOTE: any migrations that ran are still applied"
            else
              echo "no previous images to roll back to; the stack stays down"
            fi
            exit 1
          REMOTE
          ) && rc=0 || rc=$?
          printf '%s\n' "$out"
          [ "$rc" = "0" ] || exit "$rc"

          # The marker is printed only at the real end of the remote script, so its
          # absence means something consumed stdin and the script exited early.
          echo "$out" | grep -q '__DEPLOY_REACHED_END__' || {
            echo "::error::remote script exited 0 without reaching its end"
            exit 1
          }
